[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reaper-interface"
version = "0.1.0"
description = "Full AI agent interface (MCP server, CLI, Python API, and REAPER Lua bridge) for controlling REAPER, editing MIDI files, and adding/editing FX & instruments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "mido>=1.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
reaper-cli = "reaper_interface.cli:main"
reaper-mcp = "reaper_interface.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reaper_interface"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
